# Personal Assistant 配置文件示例
# 将本文件复制为 $PA_HOME/config.toml 后按需修改

[extractor]
# 抽取模式："agent"（默认，由当前对话模型抽取）或 "api"（由服务端直连 OpenAI 兼容接口）
mode = "agent"

[api]
# 仅在 extractor.mode = "api" 时生效
base_url = "https://api.openai.com/v1"
model = "gpt-4o-mini"
# 推荐通过环境变量提供密钥，而非明文写入配置文件
api_key_env = "PA_API_KEY"
# api_key = ""

[embedding]
# 是否启用本地向量检索（关闭或模型不可用时自动退化为纯 BM25 关键词检索）
enabled = true
model = "BAAI/bge-small-zh-v1.5"

[retrieval]
# 混合检索打分权重
vector_weight = 0.45
bm25_weight = 0.25
importance_weight = 0.15
recency_weight = 0.15
# 时间衰减半衰期（天）
recency_half_life_days = 90.0

[profile]
# SessionStart 注入的精简画像最大字符数
compact_max_chars = 600

[privacy]
# 入库前自动对密钥、Token、手机号、身份证号进行正则脱敏
redact = true

[sources]
# Antigravity 会话日志根目录
antigravity_brain_dir = "~/.gemini/antigravity/brain"

[behavior]
# 静默模式：画像与记忆维护在后台暗线进行，不主动向用户汇报
silent = true
# 反思生成的画像更新提案是否自动应用（无需人工确认）
auto_apply = true
# 每轮后台自动抽取的最大会话数
auto_ingest_limit = 10
# 距上次画像版本新增多少个事件摘要后自动触发反思
reflect_min_episodes = 5
