[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-assistant"
version = "0.1.0"
description = "本地优先、可自我迭代的个人记忆与用户画像助理（MCP 服务与 Antigravity 插件）"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Nanoda16" }]
dependencies = [
    "mcp>=1.2,<2",
    "jieba",
    "numpy",
    "httpx",
]

[project.optional-dependencies]
local-embed = ["sentence-transformers"]
dev = ["pytest"]

[project.scripts]
pa = "personal_assistant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
